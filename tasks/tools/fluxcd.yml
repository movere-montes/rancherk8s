---
- name: Flux - Fetch release data from GitHub API [e3446d5]
  ansible.builtin.uri:
    url: "https://api.github.com/repos/fluxcd/flux2/releases/latest"
    method: GET
    return_content: true
  register: rancherk8s_tools_flux_latest_version

- name: Check if flux installed [8563063]
  ansible.builtin.stat:
    path: '/usr/local/bin/flux'
  register: rancherk8s_tools_flux_state

- name: Check current installed version of flux [a9764ba]  # noqa risky-shell-pipe
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      flux --version | awk '{ print $3}'
    executable: /bin/bash
  register: rancherk8s_tools_flux_gathered_version2
  changed_when: false
  when: rancherk8s_tools_flux_state.stat.exists

- name: Install flux [549fa96]  # noqa command-instead-of-module no-changed-when
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -s https://fluxcd.io/install.sh | bash
    executable: /bin/bash
  vars:
    rancherk8s_flux_gathered_version: "{{ rancherk8s_tools_flux_gathered_version2.stdout }}"
    rancherk8s_flux_latest_version: "{{ rancherk8s_tools_flux_latest_version.json.tag_name | replace('v', '') }}"
  when:
    - (not rancherk8s_tools_flux_state.stat.exists) or
      (rancherk8s_flux_latest_version is version(rancherk8s_flux_gathered_version, '>'))

- name: Flux Check [6c47be2]
  when:
    - rancherk8s_flux_bootstrap
    - rancherk8s_tools_flux_state.stat.exists
  block:
    - name: Flux Check [295f450]
      ansible.builtin.shell:
        cmd: 'flux check'
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ rancherk8s_kubeconfig }}"
      changed_when: false
      register: rancherk8s_flux_check
      ignore_errors: true

    - name: Set fact rancherk8s_flux_bootstrap to false when already bootstrapped [dc89f78]
      ansible.builtin.set_fact:
        rancherk8s_flux_bootstrap: false
      when: rancherk8s_flux_check.stderr_lines is search('all checks passed')

- name: Install SOPS age key for Flux decryption [9e02d3a]
  ansible.builtin.include_tasks: tools/sops.yml
  when: rancherk8s_flux_sops_age_key_enabled

- name: Bootstrap fluxcd [6ec1a46]
  when: rancherk8s_flux_bootstrap
  block:
    - name: Create bootstrap file [915f0d6]
      ansible.builtin.template:
        src: 'fluxcd-bootstrap.sh.j2'
        dest: '/opt/fluxcd-bootstrap.sh'
        mode: '0755'

    - name: Check if cluster is reachable [ce3b0d7]
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: kube-system
      register: rancherk8s_system_check
      until: rancherk8s_system_check is succeeded
      retries: 10
      environment:
        KUBECONFIG: "{{ rancherk8s_kubeconfig }}"

    - name: Run bootstrap file [9bda11a]  # noqa no-changed-when
      ansible.builtin.shell:
        cmd: '/bin/bash /opt/fluxcd-bootstrap.sh'
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ rancherk8s_kubeconfig }}"
